<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #f5eeee;
            color: #78152e;
            text-align: center;
        }

        .cover {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .frame {
            width: 190px;
            height: 240px;
            border: 5px double #8c1735;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            font-size: 65px;
        }

        h1 {
            font-size: 30px;
            margin: 15px;
        }

        p {
            margin: 12px;
        }

        button {
            background: #851c39;
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        .invitation {
            display: none;
            padding: 60px 20px;
            min-height: 100vh;
            background: #fffafa;
        }
    </style>
</head>

<body>

    <section class="cover">
        <div class="frame">♡</div>

        <p>THE WEDDING OF</p>
        <h1>Nama Pasangan</h1>

        <p>Kepada Yth.</p>
        <h3 id="namaTamu">Tamu Undangan</h3>

        <button onclick="bukaUndangan()">
            OPEN INVITATION
        </button>
    </section>

    <section class="invitation" id="isiUndangan">
        <h1>You're Invited!</h1>
        <p>Dengan penuh kebahagiaan,</p>
        <p>kami mengundang Anda ke acara pernikahan kami.</p>
        <h2>Nama Pasangan</h2>
    </section>

    <script>
        // Mengambil nama dari URL
        const params = new URLSearchParams(window.location.search);
        const nama = params.get("to");

        if (nama) {
            document.getElementById("namaTamu").textContent =
                nama.replace(/\+/g, " ");
        }

        // Membuka halaman undangan
        function bukaUndangan() {
            document.getElementById("isiUndangan").style.display = "block";

            document.getElementById("isiUndangan").scrollIntoView({
                behavior: "smooth"
            });
        }
    </script>

</body>
</html>
