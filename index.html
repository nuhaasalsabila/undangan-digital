
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Undangan Pernikahan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5eeee;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .halaman {
            width: 100%;
            display: block;
        }

        .halaman img {
            width: 100%;
            height: auto;
            display: block;
        }

        #cover {
            cursor: pointer;
        }

        #isiUndangan {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HALAMAN COVER -->
        <div id="cover" onclick="bukaUndangan()">
            <img src="1.webp" alt="Cover Undangan">
        </div>

        <!-- HALAMAN ISI -->
        <div id="isiUndangan" class="halaman">
            <img src="2.webp" alt="Isi Undangan">
        </div>

    </div>

    <!-- MUSIK -->
    <audio id="musik" loop>
        <source src="musik_salsa.mp3" type="audio/mpeg">
    </audio>

    <script>

        function bukaUndangan() {

            // Menampilkan halaman isi
            document.getElementById("cover").style.display = "none";

            document.getElementById("isiUndangan").style.display = "block";

            // Memutar musik
            const musik = document.getElementById("musik");

            musik.play().catch(function(error) {
                console.log("Musik belum dapat diputar:", error);
            });

            // Kembali ke posisi paling atas
            window.scrollTo(0, 0);

        }

    </script>

</body>
</html>
